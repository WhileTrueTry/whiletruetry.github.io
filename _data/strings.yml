# Strings
# =======================================================================================
# This file contains all soft-coded strings of the theme.
# You can edit them here if you want to change the wording of certain phrases,
# e.g. maybe you prefer "Fetching…" to "Loading…", etc.
#
# You can also use this to "translate" the theme into different langauges,
# but note that this may not work in all situations,
# especially for languages that differ significantly from English.

# Free version
# ---------------------------------------------------------------------------------------
home:                  Inicio
pages:                 Páginas
posts:                 Publicaciones
about:                 Contacto
related_posts:         Publicaciones Relacionadas
other_projects:        Otros Proyectos
comments:              Comentarios
jump_to:               Saltar a
navigation:            Navegación
social:                Social
links:                 Enlaces
links_icon:            'icon-link'
pagination:            Paginación
newer:                 Más reciente
older:                 Más antiguo
forward:               Adelante
back:                  Atrás
permalink:             Enlace permanente
permalink_icon:        'content-hash'
templates:             Plantillas (para aplicación web)
present:               presente
toc:                   Tabla de Contenidos
note:                  Nota
description:           Descripción
search:                Buscar
search_placeholder:    Escribe algo…

loading:               Cargando…
redirecting:           Redirigiendo…

continue_reading:      >
  Continuar leyendo <!--post_title-->

cookies_banner:
  text:                >
    Este sitio utiliza cookies. [Política de Cookies](/cookies-policy/).
  okay:                Aceptar

not_found:
  title:               '404: Página No Encontrada'
  message:             |
    Lo sentimos, hemos perdido esa URL o está apuntando a algo que no existe.
    <!--home_link--> para intentar encontrarlo de nuevo.
  home_link:           Volver al inicio

offline:
  title:               'Estás Desconectado'
  message:             |
    Lo sentimos, pero parece que estás desconectado y esta página no ha sido preparada para visualización sin conexión.
    <!--home_link--> para intentar encontrar otra página.
  home_link:           Volver al inicio

error:
  title:               Error
  message:             |
    Lo sentimos, ocurrió un error al cargar <!--link-->.

